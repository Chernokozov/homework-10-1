[tool.poetry]
name = "home-work-10-1"
version = "0.1.0"
description = ""
authors = ["Chernokozov Yuriy <Chernokozovyu@gmail.com>"]
readme = "README.md"
packages = [{include = "home_work_10"}]

[tool.poetry.dependencies]
python = "^3.12"


[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
mypy = "^1.19.0"
isort = "^7.0.0"
pytest = "^9.0.1"
black = "^25.11.0"

[tool.poetry.scripts]
bank-widget = "src.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.flake8]
max-line-length = 119
extend-ignore = "E203, W503"
exclude = [".git", "__pycache__", ".venv"]
