[tool.poetry]
name = "home-work-10-1"
version = "0.1.0"
description = "Homework 10.1 - Banking operations processing"
authors = ["Chernokozov Yuriy <Chernokozovyu@gmail.com>"]
readme = "README.md"
packages = [{include = "src", from = "."}]

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
mypy = "^1.19.0"
isort = "^7.0.0"
pytest = "^9.0.1"
black = "^25.11.0"
pytest-cov = "^5.0.0"

[tool.poetry.scripts]
bank-widget = "src.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 119

# ИСПРАВЛЕННЫЙ mypy конфиг
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    "^.venv/",
    "^.git/",
    "^__pycache__/",
    "^.mypy_cache/",
    "^.pytest_cache/"
]

[tool.flake8]
max-line-length = 119
extend-ignore = "E203, W503, E501"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
    "venv",
    ".mypy_cache",
    ".pytest_cache"
]

[tool.black]
line_length = 119
target_version = ["py312"]
extend_exclude = '''
/(
    \.git
    | \.venv
    | venv
    | build
    | dist
    | __pycache__
    | \.mypy_cache
    | \.pytest_cache
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/test_*.py",
    "*/.mypy_cache/*",
    "*/.pytest_cache/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]
